services:
  # --- Flask Web API ---
  - type: web
    name: loki-logistics-api
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn autoapp:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: autoapp.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loki-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: loki-redis
          property: connectionString

  # --- Redis Service ---
  - type: keyvalue
    name: loki-redis
    ipAllowList: []

# --- PostgreSQL Database ---
databases:
  - name: loki-db
    databaseName: lokilogistics
    user: loki