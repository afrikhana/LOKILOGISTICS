services:
  - type: web
    name: loki-logistics-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && (flask db stamp head || true) && flask db upgrade"
    startCommand: "gunicorn autoapp:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: autoapp.py
      - key: SEND_FILE_MAX_AGE_DEFAULT
        value: "31536000"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loki-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: loki-redis
          property: connectionString

  - type: keyvalue
    name: loki-redis
    plan: free
    ipAllowList: []

databases:
  - name: loki-db
    databaseName: lokilogistics
    user: loki
    plan: free